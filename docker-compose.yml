# Local development: `docker compose up --build --watch`.
# Compose Watch syncs edits into the containers (a bind mount doesn't deliver
# file events on Docker Desktop for Windows); a package.json or lockfile
# change rebuilds the image. Production images are each Dockerfile's final
# stage — see the deploy notes in web-shuttio/README.md.

# Every service sets CI=true: with no TTY, pnpm's pre-run deps check must
# reinstall without prompting.

# Dev-only Centrifugo secrets below are shared by `centrifugo` and `api`;
# override them with a root `.env` (never reuse these outside local dev).

services:
  # Realtime transport (WebSocket pub/sub). The browser connects to :8000 with
  # a JWT the api signs. The HTTP API, health and admin UI live on the internal
  # port 9000 (centrifugo/config.json `http_server.internal_port`) — published
  # on loopback only, and reached by the api over the compose network.
  # Admin UI (off by default): set CENTRIFUGO_ADMIN_ENABLED=true plus
  # CENTRIFUGO_ADMIN_PASSWORD and CENTRIFUGO_ADMIN_SECRET in `.env`, then open
  # http://localhost:9000.
  centrifugo:
    image: centrifugo/centrifugo:v6
    command: centrifugo --config /centrifugo/config.json
    volumes: ["./centrifugo/config.json:/centrifugo/config.json:ro"]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-dev-centrifugo-hmac-secret-change-me}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-dev-centrifugo-api-key}
      CENTRIFUGO_ADMIN_ENABLED: ${CENTRIFUGO_ADMIN_ENABLED:-false}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:-}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:-}
    ports:
      - "8000:8000"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Optional local MongoDB for dev/tests (`docker compose --profile localdb up
  # -d mongo`). The api still uses DATABASE_URL (Atlas) unless you point it here:
  # mongodb://localhost:27017/shuttio
  mongo:
    image: mongo:8
    profiles: ["localdb"]
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]

  api:
    build: { context: ./api, target: dev }
    env_file: ./api/.env
    environment:
      CI: "true"
      CENTRIFUGO_API_URL: http://centrifugo:9000/api
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-dev-centrifugo-api-key}
      CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-dev-centrifugo-hmac-secret-change-me}
      # CORS allow-list: the Next.js app and the TanStack app side by side.
      WEB_URL: http://localhost:3000,http://localhost:3001
    ports: ["6969:6969"]
    depends_on:
      centrifugo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:6969/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    develop:
      watch:
        - { action: sync, path: ./api, target: /app, ignore: [node_modules/, dist/] }
        - { action: rebuild, path: ./api/package.json }
        - { action: rebuild, path: ./api/pnpm-lock.yaml }

  # Legacy Next.js app — kept until the TanStack migration replaces it.
  # web:
  #   build: ./web
  #   # Wait for the api's readiness probe: the dashboard layout fetches it on
  #   # the server and would hit ECONNREFUSED during api watch compilation.
  #   command: >-
  #     sh -c "find .next -mindepth 1 -maxdepth 1 -exec rm -rf {} +;
  #     until node -e \"fetch('http://api:6969/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\"; do sleep 1; done;
  #     pnpm dev"
  #   env_file:
  #     - { path: ./web/.env.local, required: false }
  #     - { path: ./web/.local.env, required: false }
  #   environment:
  #     CI: "true"
  #     API_URL: http://api:6969
  #     NEXT_PUBLIC_API_URL: http://localhost:6969
  #   ports: ["3000:3000"]
  #   depends_on:
  #     api: { condition: service_healthy }
  #   develop:
  #     watch:
  #       - { action: sync, path: ./web, target: /app, ignore: [node_modules/, .next/] }
  #       - { action: rebuild, path: ./web/package.json }
  #       - { action: rebuild, path: ./web/pnpm-lock.yaml }

  web-shuttio:
    build: { context: ./web-shuttio, target: dev }
    env_file: ./web-shuttio/.env.local
    environment:
      CI: "true"
      # The browser calls the api through the host port, not the network name.
      VITE_API_URL: http://localhost:6969
      VITE_CENTRIFUGO_URL: ws://localhost:8000/connection/websocket
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    develop:
      watch:
        - action: sync
          path: ./web-shuttio
          target: /app
          ignore: [node_modules/, .output/, .tanstack/, src/paraglide/, project.inlang/cache/, .env.local]
        - { action: rebuild, path: ./web-shuttio/package.json }
        - { action: rebuild, path: ./web-shuttio/pnpm-lock.yaml }

volumes:
  mongo-data:
